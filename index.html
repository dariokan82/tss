:root {
  /* ------- BRAND CORE ------- */
  --ts-ember:       #D06028;   /* sampled from logo */
  --ts-ember-deep:  #B14A1C;
  --ts-ember-bright:#E47A40;

  --ts-ink:         #0A0908;   /* near-black canvas */
  --ts-ash:         #14110F;   /* slightly lifted black */
  --ts-coal:        #1F1B17;   /* card surface on dark */
  --ts-soot:        #2A2520;   /* hover surface */
  --ts-smoke:       #6B5D52;   /* warm gray */
  --ts-fog:         #9A8E80;   /* secondary text on dark */
  --ts-bone:        #C9BCAC;   /* subtle text on dark */
  --ts-paper:       #F1E9DA;   /* primary fg on dark / cream paper bg */
  --ts-cream:       #F5EDE0;

  /* ------- SEMANTIC ------- */
  --ts-bg:          var(--ts-ink);
  --ts-bg-elev:     var(--ts-ash);
  --ts-bg-card:     var(--ts-coal);
  --ts-bg-paper:    var(--ts-cream);

  --ts-fg:          var(--ts-paper);
  --ts-fg-1:        var(--ts-paper);
  --ts-fg-2:        var(--ts-bone);
  --ts-fg-3:        var(--ts-fog);
  --ts-fg-on-paper: var(--ts-ink);

  --ts-accent:      var(--ts-ember);
  --ts-accent-hover: var(--ts-ember-bright);
  --ts-accent-soft: rgba(208, 96, 40, 0.15);

  --ts-border:      rgba(241, 233, 218, 0.14);
  --ts-border-strong: rgba(241, 233, 218, 0.32);
  --ts-border-paper: #C9BCAC;

  --ts-success:     #7AAE5A;
  --ts-warn:        #D6A24B;
  --ts-error:       #D6553A;

  /* ------- TYPE -------
     Bantayog — display / headers / big statements (loaded locally above)
     DM Sans  — body and UI text
     IM Fell English — editorial italic accents
     Special Elite   — eyebrows, captions, hand stamp
     JetBrains Mono  — mono
     Rye is kept available as a legacy western/poster option for posters & marquee art.
  */
  --ts-font-display: "Bantayog", "DM Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ts-font-poster:  "Rye", "Rockwell", "Courier New", serif;
  --ts-font-serif:   "IM Fell English", "Iowan Old Style", Georgia, serif;
  --ts-font-hand:    "Special Elite", "American Typewriter", "Courier New", monospace;
  --ts-font-sans:    "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --ts-font-mono:    "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  /* ------- TYPE SCALE ------- */
  --ts-fs-12: 0.75rem;
  --ts-fs-14: 0.875rem;
  --ts-fs-16: 1rem;
  --ts-fs-18: 1.125rem;
  --ts-fs-20: 1.25rem;
  --ts-fs-24: 1.5rem;
  --ts-fs-32: 2rem;
  --ts-fs-44: 2.75rem;
  --ts-fs-60: 3.75rem;
  --ts-fs-84: 5.25rem;
  --ts-fs-120: 7.5rem;

  /* ------- SPACING (4px base) ------- */
  --ts-sp-2: 2px;  --ts-sp-4: 4px;  --ts-sp-8: 8px;
  --ts-sp-12: 12px; --ts-sp-16: 16px; --ts-sp-24: 24px;
  --ts-sp-32: 32px; --ts-sp-48: 48px; --ts-sp-64: 64px;
  --ts-sp-96: 96px; --ts-sp-128: 128px;

  /* ------- RADII (mostly square; A24-ish) ------- */
  --ts-radius-sm: 0;
  --ts-radius:    2px;
  --ts-radius-md: 4px;
  --ts-radius-lg: 8px;
  --ts-radius-pill: 999px;

  /* ------- SHADOWS ------- */
  --ts-shadow-sm:  0 1px 2px rgba(0,0,0,0.3);
  --ts-shadow:     0 4px 16px rgba(0,0,0,0.4);
  --ts-shadow-md:  0 12px 32px rgba(0,0,0,0.5);
  --ts-shadow-lg:  0 28px 64px rgba(0,0,0,0.6);
  --ts-shadow-ember: 0 0 0 1px var(--ts-ember), 0 8px 32px rgba(208,96,40,0.4);

  /* ------- MOTION ------- */
  --ts-ease:    cubic-bezier(0.2, 0.7, 0.2, 1);
  --ts-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ts-dur-1: 120ms; --ts-dur-2: 240ms; --ts-dur-3: 480ms;
}

/* ============================================
   BASE
   ============================================ */
html, body {
  margin: 0;
  background: var(--ts-bg);
  color: var(--ts-fg);
  font-family: var(--ts-font-sans);
  font-size: var(--ts-fs-16);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--ts-ember); color: var(--ts-paper); }

/* ============================================
   SEMANTIC TYPE
   ============================================ */
.ts-display {
  font-family: var(--ts-font-display);
